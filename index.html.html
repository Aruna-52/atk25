<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .iris-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .input-hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-container.success {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            display: block;
        }

        .result-container.error {
            background: #ffe0e0;
            display: block;
        }

        .result-label {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .result-container.error .result-value {
            font-size: 16px;
            color: #c00;
        }

        .flower-images {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .flower-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        .flower-badge.setosa { background: #ffcccb; color: #8b0000; }
        .flower-badge.versicolor { background: #c1e1c1; color: #006400; }
        .flower-badge.virginica { background: #add8e6; color: #00008b; }

        .flower-badge.active {
            opacity: 1;
            transform: scale(1.1);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 25px 0;
        }

        .info-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .info-section h3 {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="iris-icon">🌸</div>
            <h1>Iris Flower Predictor</h1>
            <p>Enter the measurements to predict the iris species</p>
        </div>

        <div class="info-section">
            <h3>📏 Measurement Guide</h3>
            <div class="info-grid">
                <div>Sepal Length: 4.3 - 7.9 cm</div>
                <div>Sepal Width: 2.0 - 4.4 cm</div>
                <div>Petal Length: 1.0 - 6.9 cm</div>
                <div>Petal Width: 0.1 - 2.5 cm</div>
            </div>
        </div>

        <form id="predictionForm">
            <div class="form-group">
                <label for="sepalLength">Sepal Length (cm)</label>
                <input type="number" id="sepalLength" name="sepal_length" 
                       step="0.1" min="0" max="10" placeholder="e.g., 5.1" required>
            </div>

            <div class="form-group">
                <label for="sepalWidth">Sepal Width (cm)</label>
                <input type="number" id="sepalWidth" name="sepal_width" 
                       step="0.1" min="0" max="10" placeholder="e.g., 3.5" required>
            </div>

            <div class="form-group">
                <label for="petalLength">Petal Length (cm)</label>
                <input type="number" id="petalLength" name="petal_length" 
                       step="0.1" min="0" max="10" placeholder="e.g., 1.4" required>
            </div>

            <div class="form-group">
                <label for="petalWidth">Petal Width (cm)</label>
                <input type="number" id="petalWidth" name="petal_width" 
                       step="0.1" min="0" max="10" placeholder="e.g., 0.2" required>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                Predict Species
            </button>
        </form>

        <div class="result-container" id="resultContainer">
            <div class="result-label">Predicted Species</div>
            <div class="result-value" id="resultValue"></div>
            <div class="flower-images">
                <span class="flower-badge setosa" id="badgeSetosa">🌺 Setosa</span>
                <span class="flower-badge versicolor" id="badgeVersicolor">🌼 Versicolor</span>
                <span class="flower-badge virginica" id="badgeVirginica">🌷 Virginica</span>
            </div>
        </div>
    </div>

    <script>
        // Replace API_URL with your actual Render deployment URL
        const API_URL = 'https://atk25.onrender.com/predict';

        const form = document.getElementById('predictionForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultValue = document.getElementById('resultValue');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get form values
            const sepalLength = parseFloat(document.getElementById('sepalLength').value);
            const sepalWidth = parseFloat(document.getElementById('sepalWidth').value);
            const petalLength = parseFloat(document.getElementById('petalLength').value);
            const petalWidth = parseFloat(document.getElementById('petalWidth').value);

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Predicting...';
            resultContainer.className = 'result-container';

            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sepal_length: sepalLength,
                        sepal_width: sepalWidth,
                        petal_length: petalLength,
                        petal_width: petalWidth
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Display result
                const prediction = data.prediction || data.species || data.class || data.result || 'Unknown';
                resultValue.textContent = prediction;
                resultContainer.className = 'result-container success';

                // Highlight the predicted species badge
                document.querySelectorAll('.flower-badge').forEach(badge => {
                    badge.classList.remove('active');
                });

                const predLower = prediction.toLowerCase();
                if (predLower.includes('setosa')) {
                    document.getElementById('badgeSetosa').classList.add('active');
                } else if (predLower.includes('versicolor')) {
                    document.getElementById('badgeVersicolor').classList.add('active');
                } else if (predLower.includes('virginica')) {
                    document.getElementById('badgeVirginica').classList.add('active');
                }

            } catch (error) {
                resultValue.textContent = `Error: ${error.message}. Please check your API URL and try again.`;
                resultContainer.className = 'result-container error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Predict Species';
            }
        });
    </script>
</body>
</html>
